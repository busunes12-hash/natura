<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&amp;display=swap');

      .bg { fill: #FFFFFF; }
      .leaf-primary { fill: #113F2A; }
      .leaf-accent { fill: #1B5E3C; opacity: 0.85; }
      .logo-text {
        fill: #113F2A;
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: 0.4em;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background: White -->
  <rect class="bg" width="800" height="600" />

  <!-- Modern Geometric Three-Leaf Icon -->
  <g transform="translate(400, 210)">
    <!-- Center Vertical Leaf -->
    <path class="leaf-primary" d="M 0,-120 Q 30,-50 0,20 Q -30,-50 0,-120 Z" />
    
    <!-- Left Angled Leaf -->
    <path class="leaf-accent" d="M -8,10 Q -65,10 -75,-60 Q -25,-60 -8,10 Z" />
    
    <!-- Right Angled Leaf -->
    <path class="leaf-accent" d="M 8,10 Q 65,10 75,-60 Q 25,-60 8,10 Z" />
    
    <!-- Center Stem -->
    <rect class="leaf-primary" x="-2" y="20" width="4" height="30" rx="2" />
  </g>

  <!-- Uppercase NATURA Typography -->
  <text x="400" y="380" dx="12" class="logo-text">NATURA</text>
</svg>
