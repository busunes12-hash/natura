<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;family=Montserrat:wght@400&amp;display=swap');

      .bg { fill: #FFFFFF; }
      .leaf-solid { fill: #0A3A2A; }
      .leaf-stroke { stroke: #0A3A2A; stroke-width: 4; fill: none; stroke-linejoin: round; }
      .logo-text {
        fill: #0A3A2A;
        font-family: 'Playfair Display', serif;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="600" />

  <g transform="translate(400, 205)">
    <!-- Center Leaf -->
    <path class="leaf-solid" d="M 0,-110 C 26,-65 24,-10 0,30 C -24,-10 -26,-65 0,-110 Z" />
    
    <!-- Left Curved Outline Leaf -->
    <path class="leaf-stroke" d="M -5,20 C -45,15 -80,-20 -70,-70 C -42,-65 -15,-25 -5,20 Z" />
    
    <!-- Right Curved Outline Leaf -->
    <path class="leaf-stroke" d="M 5,20 C 45,15 80,-20 70,-70 C 42,-65 15,-25 5,20 Z" />

    <!-- Stem -->
    <path class="leaf-solid" d="M -1.5,30 L -1.5,58 L 1.5,58 L 1.5,30 Z" />
  </g>

  <text x="400" y="380" dx="10" class="logo-text">NATURA</text>
</svg>
